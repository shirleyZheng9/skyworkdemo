bote.license.enabled=false

# 日志配置: LOG_LEVEL_PROFILE 可为 dev, test, prod。
# 传统部署方式下请将值固定为 classpath:logback/bote-dev.xml
logging.config=/opt/config/logback.xml

# 环境编码，可为 dev, test, prod
bote.env.code=dev

################################# zookeeper 配置 #################################
# ZooKeeper 地址
bote.zookeeper.server=10.0.13.16:22181
# ZooKeeper 命名空间前缀
bote.zookeeper.namespace-prefix=bote-dev

################################# 数据库 配置 #################################
# mysql数据库配置
jdbc.url=jdbc:mysql://10.0.13.16:23306/bote
# 为pg库的IP端口 、库名，为模式名
jdbc.username=root
#mysql库口令，可以配置为明文或密文，密文配置示例：{cipher}{rsa}gSUarifRA35j9d0N+NIWaTk= 其中{cipher}{rsa}为固定加解密方法
jdbc.password=Dict@2025

################################# 缓存 配置 #################################
# 缓存类型：Redis, CtgCache
cache.type=Redis
# 命名空间列表（命名空间必须是整数，范围为 [1, 99]），redis配置时保证唯一不冲突
cache.namespaces=10
# 默认命名空间
cache.defaultNamespace=10
cache.redis.10.serverList=10.0.13.16:26380
# 密码: 密码，可选，支持加密，直接配置密文即可
cache.redis.10.password=Dict@2025

# 默认存储类型：支持 MINIO
dfs.default.type=MINIO


################################# MINIO 配置 #################################
# 是否启用 MINIO
dfs.minio.enabled=true
# 服务地址
dfs.minio.endpoint=http://10.0.13.16:25000
# 用户名
dfs.minio.accessKey=admin
# 密码: 支持加密，直接配置密文即可
dfs.minio.secretKey=Dict@2025
# bucket 名称
dfs.minio.bucketName=bote
# 存储路径前缀，可选
dfs.minio.prefixPath=bote/

################################# 门户对接 #################################

# 博特自身门户配置
# sessionId cookie 名称，默认为 BOTE_SESSION
bote.portal.cookieName=BOTE_SESSION
# session 超时时间，默认为 24h
bote.portal.timeout=7d
# BOTE_SESSION 历史残留的待清理 path 列表（逗号分隔），用于自愈清理同名多 path cookie；默认 /bote
bote.portal.cookieCleanupPaths=/bote

# 门户类型: default, ngportal, uportal, none
#bote.portal.type=default

# RAG 平台接口地址（暂不支持使用，无需修改）
#knowledge.rag.apiUrl=http:///
knowledge.rag.apiUrl=http://127.0.0.1:29091/


# DocChain 接口地址（必须配置，影响功能正常使用）
knowledge.docChain.apiUrl=http://10.0.55.59:7000/

# 博特平台接口地址（以 / 结尾）
bote.apiUrl=http://10.0.13.16:29500/bote/api/
bote.webUrl=http://10.0.13.16:29500/bote/api/

#向量存储类型 elasticsearch、pgvector
nl2sql.vectorType=elasticsearch
nl2sql.elasticsearch.host=10.0.13.16
nl2sql.elasticsearch.port=29200
nl2sql.elasticsearch.username=elastic
nl2sql.elasticsearch.password=abc@123A
nl2sql.elasticsearch.namespace=bote_test

#获取accessToken中转地址，避免未设置白名单无法获取accessToken的问题
bote.publish.mp.server-url=http://47.99.203.16:8400/mp/cgi-bin/token




# 博特平台环境类型（配置态 Develop、运行态 Operate）
bote.env.type=Develop



# 开启多渠道长连接检查 默认关闭  
bote.connection-health-check.enabled=true
# 设置多渠道长连接检查定时任务的执行频率 不配置默认为30000ms
bote.connection-health-check.checkInterval=30000
# 设置多渠道长连接检查定时任务首次执行的延迟时间 不配置默认为60000ms
bote.connection-health-check.initialDelay=60000

bote.env.deploy.type=separate
bote.security.sign.whitelist[0]=/bote/dc/sidecar/documents/**
bote.security.sign.whitelist[1]=/bote/dc/document/file/**
bote.security.sign.whitelist[2]=/bote/dc/socket/token/**
bote.security.sign.whitelist[3]=/bote/dc/document/attachment/files/**


# 文档中心文件预览配置
bote.dc.file.preview.enabled=true
# 文件下载地址
bote.dc.file.preview.file-download-url=http://10.0.13.16:29500/bote/api/bote/dc/document/file/download/{token}
bote.dc.file.preview.server-host=http://10.0.13.16:29500/bote
# 预览服务地址
bote.dc.file.preview.kk-file-view-url=${bote.dc.file.preview.server-host}/dc/docfileview/onlinePreview
# 查询转换状态URL
bote.dc.file.preview.convert-status-url=${bote.dc.file.preview.server-host}/dc/docfileview/checkConvertStatus

# 请求超时时间(秒)
bote.mcp.client.requestTimeout=300

################################# Langfuse 可观测性 #################################
bote.langfuse.enabled=true
bote.langfuse.base-url=http://10.0.13.65:3000
bote.langfuse.public-key=pk-lf-20b358e3-41aa-43e6-adf1-e7f9f94afdb6
bote.langfuse.secret-key=sk-lf-15a8bd5f-225b-4225-b9f2-f763f7444b33