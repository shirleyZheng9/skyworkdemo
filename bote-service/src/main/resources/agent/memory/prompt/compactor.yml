# 短期记忆压缩相关提示词
# 参考 https://github.com/agentscope-ai/ReMe/blob/v0.3.0.6b3/reme/memory/file_based/components/compactor.yaml

# 系统提示词
system_prompt: >-
  你是一个上下文压缩助手。你的角色是创建对话的结构化摘要，
  这些摘要可以在未来会话中用于恢复上下文。专注于保留关键信息，同时减少token数量。

# 生成摘要的提示词
summary_prompt_template: |
  <conversation>
  %s
  </conversion>

  上述消息是一场需要总结的对话。创建一个结构化的上下文检查点摘要，
  以便另一个LLM可以用来继续工作。

  使用此确切格式：

  ## 目标
  [用户试图完成什么？如果会话涵盖不同任务，可以有多个项目。]

  ## 约束和偏好
  - [任何用户提到的约束、偏好或要求]
  - [或者如果没有提到则为"(none)"]

  ## 进展
  ### 已完成
  - [x] [已完成的任务/更改]

  ### 进行中
  - [ ] [当前工作]

  ### 阻塞
  - [如果有任何阻碍进展的问题]

  ## 关键决策
  - **[决策]**: [简短理由]

  ## 下一步
  1. [接下来应该发生的事情的有序列表]

  ## 关键上下文
  - [任何继续工作所需的数据、示例或参考资料]
  - [或者如果不适用则为"(none)"]

  保持每个部分简洁。保留确切的文件路径、函数名称和错误消息。

# 更新摘要的提示词
update_summary_prompt_template: |
  <conversation>
  %s
  </conversion>

  以上消息是需要整合到现有摘要中的新对话内容，现有摘要位于<previous-summary>标签中。

  <previous-summary>
  %s
  </previous-summary>

  用新信息更新现有的结构化摘要。规则：
  - 保留来自先前摘要的所有现有信息
  - 从新消息中添加新的进展、决策和上下文
  - 更新进度部分：当完成时将项目从"进行中"移到"已完成"
  - 根据已完成的内容更新"下一步"
  - 保留确切的文件路径、函数名称和错误消息
  - 如果某些内容不再相关，您可以删除它

  使用此确切格式：

  ## 目标
  [保留现有目标，如果任务扩展则添加新目标]

  ## 约束和偏好
  - [保留现有内容，添加发现的新内容]

  ## 进展
  ### 已完成
  - [x] [包含以前完成的项目和新完成的项目]

  ### 进行中
  - [ ] [当前工作 - 根据进展更新]

  ### 阻塞
  - [当前阻塞问题 - 如果解决则删除]

  ## 关键决策
  - **[决策]**: [简短理由]（保留所有之前的内容，添加新的）

  ## 下一步
  1. [根据当前状态更新]

  ## 关键上下文
  - [保留重要上下文，如需要则添加新的]

  保持每个部分简洁。保留确切的文件路径、函数名称和错误消息。

# 每日记忆摘要生成提示词（用于将压缩的对话生成每日记录条目）
# 参考 https://github.com/agentscope-ai/QwenPaw/blob/main/src/qwenpaw/agents/memory/reme_light_memory_manager.py#summary_memory
daily_summary_prompt_template: |
  <conversation>
  %s
  </conversation>

  以上是今天发生的一段对话记录。请生成一段简洁的每日记忆条目，用于记录今天的重要事件和成果。

  要求：
  - 以 markdown 段落格式输出，不要添加日期标题（外部已加）
  - 重点记录：完成的任务、做出的决策、学到的知识、用户的偏好/反馈
  - 省略闲聊和无意义的工具调用细节
  - 如实记录，不添加多余的主观判断
  - 简洁明了，控制在 200 字以内

# 每日记忆系统提示词（专用于每日记忆生成）
daily_system_prompt: >-
  你是一个每日记忆记录助手。你的角色是将对话内容提炼成简洁的每日记录条目，
  重点关注实际完成的工作、重要决策和经验教训，而不是对话的结构化摘要。

# 每日记忆更新提示词（用于结合已有内容做智能更新）
daily_update_prompt_template: |
  以下是今天的已有记忆内容：
  <existing-memory>
  %s
  </existing-memory>

  以下是今天新发生的对话记录：
  <new-conversation>
  %s
  </new-conversation>

  请根据新对话内容更新每日记忆。规则：
  - 保留已有记忆中的所有重要信息
  - 将新对话中的关键信息整合到合适的部分
  - 避免重复记录相同内容
  - 如果有冲突信息，以最新对话为准
  - 保持简洁，控制在 500 字以内
  - 以 markdown 格式输出，不要添加日期标题

  输出更新后的完整每日记忆内容。