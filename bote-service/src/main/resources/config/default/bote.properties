# Python pip 源, 比如 https://mirrors.ustc.edu.cn/pypi/simple
# bote.pip.registry=
# NPM 源，比如 https://registry.npmmirror.com
# bote.npm.registry=

# 博特平台接口地址（以 "/" 结尾），
bote.apiUrl=http://127.0.0.1:${server.port}/
# 博特平台环境类型（配置态 Develop、运行态 Operate）
bote.env.type=Develop

# License公钥
bote.license.public.

# 鉴权 session 名称，和 bote.portal.cookieName 配置保持一致
server.servlet.session.cookie.name=${bote.portal.cookieName:BOTE_SESSION}
# session 超时时间，默认 24h，和 bote.portal.timeout 配置保持一致
server.servlet.session.timeout=${bote.portal.timeout:24h}
# 安全框架用户登录前缀
basiccenter.requestMappingPrefix=/bote
# 需要绕过csrf校验的地址
app.security.csrfUrlSkip=/bote/.*
# 鉴权服务日志表
litchi.authlog.table=bt_auth_serv_log
# 鉴权 session 缓存分组
basiccenter.session.group=bote


# 定时任务执行日志数据清理
archive.clear.tableKeyQueryParams[0].tableName=bt_job_log
archive.clear.tableKeyQueryParams[0].extraCondition=
archive.clear.tableKeyQueryParams[0].timeColumn=start_time
archive.clear.tableKeyQueryParams[0].keepDays=7

# MQ 功能开关
litchi.mq.enabled=false
