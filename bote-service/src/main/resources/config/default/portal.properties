########### 门户对接 ###########
# 门户类型: default, ngportal, uportal, basiccenter, none
bote.portal.type=default

# 是否开启多门户功能，默认不开启。bote.portal.type=default 时使用
bote.portal.multi.enabled=true

# 博特自身门户配置
# sessionId cookie 名称，默认为 BOTE_SESSION
bote.portal.cookieName=BOTE_SESSION
# session 超时时间，默认为 24h
bote.portal.timeout=24h
# BOTE_SESSION 历史残留的待清理 path 列表（逗号分隔），用于自愈清理同名多 path cookie；默认 /bote
bote.portal.cookieCleanupPaths=/bote

# ngportal 配置。bote.portal.type=ngportal 时使用
# ngportal 访问地址
#bote.ngportal.url=http://172.16.108.18:8081/portal/
# ngportal sessionId cookie 名称
#bote.ngportal.cookieName=SESSION

# uportal 配置。bote.portal.type=uportal 时使用
# uportal 访问地址
#bote.uportal.url=http://10.45.46.226:8083/portal-web/
# uportal sessionId cookie 名称
#bote.uportal.cookieName=SESSION

########### 天工统一 OIDC Token ###########
# 非天工环境默认关闭；天工部署时覆盖为 true，并配置 security.oidc.* 参数。
bote.tg.oidc.enabled=true
