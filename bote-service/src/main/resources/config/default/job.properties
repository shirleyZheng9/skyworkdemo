# 是否开启定时任务
job.enabled=true
# ZooKeeper 服务器地址
job.zookeeper.server=${bote.zookeeper.server}
# ZooKeeper 命名空间（节点名称，可以包含多级路径，开头和结尾的 / 可省略）
job.zookeeper.namespace=${bote.zookeeper.namespace-prefix}/job
# Zookeeper 鉴权 digest, 格式为 username:password。可选
job.zookeeper.digest=${bote.zookeeper.digest:}

# 定时任务配置
# 同一 IP 运行多个应用实例时区分不同实例
job.config.application=2000
# 中心编码，从 bss_job 表查询任务时作为查询条件
job.config.center=bote
# 定时任务表名称
job.custom.table=bt_job
# 定时任务执行日志表名称
job.custom.log.table=bt_job_log
