# Spring 基本配置

# 使用虚拟线程
spring.threads.virtual.enabled=true
spring.main.keep-alive=true

# 缓存类型
spring.cache.type=none

# 上传文件大小限制
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# 前后端交互使用的日期格式
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.timezone=GMT+8

# 国际化不要使用系统语言
spring.messages.fallback-to-system-locale=false

# 禁用不需要的功能
spring.freemarker.enabled=false
spring.groovy.template.check-template-location=false
spring.data.redis.repositories.enabled=false
spring.data.elasticsearch.repositories.enabled=false

# 不缓存静态资源
spring.web.resources.cache.cachecontrol.no-cache=true

# 禁用不需要的自动配置
spring.autoconfigure.exclude=\
    org.springframework.boot.actuate.autoconfigure.metrics.cache.CacheMetricsAutoConfiguration,\
    org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,\
    org.springframework.boot.autoconfigure.data.elasticsearch.ReactiveElasticsearchRepositoriesAutoConfiguration,\
    org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
    org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,\
    org.springframework.boot.autoconfigure.data.web.SpringDataWebAutoConfiguration,\
    org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration,\
    org.springframework.boot.autoconfigure.freemarker.FreeMarkerAutoConfiguration,\
    org.springframework.boot.autoconfigure.groovy.template.GroovyTemplateAutoConfiguration,\
    org.springframework.boot.autoconfigure.gson.GsonAutoConfiguration,\
    org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
    org.springframework.boot.autoconfigure.quartz.QuartzAutoConfiguration,\
    org.springframework.cloud.autoconfigure.RefreshEndpointAutoConfiguration,\
    org.springframework.cloud.client.ReactiveCommonsClientAutoConfiguration

# Actuator 配置
# 禁用 discovery 页面，减少安全扫描风险
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.caches.access=none
management.health.redis.enabled=false
management.health.sentinel.enabled=false
management.health.elasticsearch.enabled=false

# MyBatis mapper 的 logger 名称前缀
mybatis.configuration.log-prefix=mapper.

# Swagger 文档配置
# 默认禁用 Swagger 文档，减少安全扫描风险
springdoc.api-docs.enabled=false
# 避免处理 ControllerAdvice 的响应
springdoc.override-with-generic-response=false
# 构造文档非常慢, 预加载以避免首次访问时请求超时
springdoc.pre-loading-enabled=true
# 不需要国际化
springdoc.disable-i18n=true
springdoc.packages-to-scan=com.iwhalecloud.bote
springdoc.api-docs.groups.enabled=false
# 使用相对路径以兼容通过网关访问且网关中配置了上下文的场景。Springdoc 默认会根据请求 contextPath 生成错误的路径
springdoc.swagger-ui.url=./v3/api-docs
springdoc.swagger-ui.config-url=./v3/api-docs/swagger-config
