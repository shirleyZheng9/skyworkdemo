# =====================================
# 分布式锁配置
# =====================================
# Redis分布式锁配置
# 是否启用Redis分布式锁
bote.lock.redis.enabled=true
# 命名空间
bote.lock.redis.namespace=bote-locks
# 锁基础路径
bote.lock.redis.lock-base-path=locks
# 是否启用缓存
bote.lock.redis.cache-enabled=true
# 最大缓存大小
bote.lock.redis.max-cache-size=1000
# 缓存过期时间（毫秒）
bote.lock.redis.cache-expire-time-ms=600000
# 默认锁过期时间（毫秒）
bote.lock.redis.default-expire-time-ms=300000
# 最大锁等待时间（毫秒）
bote.lock.redis.max-wait-time-ms=30000
# 最大重试次数
bote.lock.redis.max-retries=3
# 重试间隔时间（毫秒）
bote.lock.redis.retry-interval-ms=1000
# Zookeeper分布式锁配置
# 是否启用Zookeeper分布式锁
bote.lock.zookeeper.enabled=false
# Zookeeper连接字符串
bote.lock.zookeeper.connect-string=${bote.zookeeper.server}
# 会话超时时间（毫秒）
bote.lock.zookeeper.session-timeout-ms=30000
# 连接超时时间（毫秒）
bote.lock.zookeeper.connection-timeout-ms=30000
# 最大重试次数
bote.lock.zookeeper.max-retries=3
# 重试间隔时间（毫秒）
bote.lock.zookeeper.retry-interval-ms=1000
# 命名空间
bote.lock.zookeeper.namespace=bote-locks
# 锁基础路径
bote.lock.zookeeper.lock-base-path=/locks
# 是否启用缓存
bote.lock.zookeeper.cache-enabled=true
# 最大缓存大小
bote.lock.zookeeper.max-cache-size=1000
# 缓存过期时间（毫秒）
bote.lock.zookeeper.cache-expire-time-ms=600000
# 默认锁过期时间（毫秒）
bote.lock.zookeeper.default-expire-time-ms=300000
# 最大锁等待时间（毫秒）
bote.lock.zookeeper.max-wait-time-ms=30000
# Zookeeper 鉴权 digest, 格式为 username:password。可选
bote.lock.zookeeper.digest=${bote.zookeeper.digest:}
