# 最大连接数，默认 20
#jdbc.maxActive=20
# 慢 SQL 阈值。单位：毫秒
jdbc.slowSqlMillis=0
# 采集慢 SQL 阈值。单位：毫秒
jdbc.collectSlowSqlMillis=3000
# SQL 语句超时时间（秒），非正数表示不限制
jdbc.statementTimeout=10
# 超长事务阈值（秒），超过时只记录错误日志，不会中止事务。非正数表示不记录
# 注意: 只在 commit/rollback 时触发，未使用事务或使用自动提交事务模式时不生效
jdbc.transactionThreshold=5
# 若未设置语句超时时间，MyBatis 可能会把事务超时时间用作语句超时时间，以致覆盖了数据源连接池上配置的语句超时时间
# org.apache.ibatis.executor.statement.BaseStatementHandler.setStatementTimeout
mybatis.configuration.defaultStatementTimeout=${jdbc.statementTimeout:0}
