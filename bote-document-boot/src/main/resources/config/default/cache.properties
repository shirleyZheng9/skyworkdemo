########### 缓存刷新配置 ###########
# ZooKeeper 服务器地址
cache.refresh.zookeeper.server=${bote.zookeeper.server}
# ZooKeeper 命名空间（节点名称，可以包含多级路径，开头和结尾的 / 可省略）
# 如果不同环境共用 ZooKeeper 服务器，可以配置不同的命名空间隔离
cache.refresh.zookeeper.namespace=${bote.zookeeper.namespace-prefix}/cache-refresh
# Zookeeper 鉴权 digest, 格式为 username:password。可选
cache.refresh.zookeeper.digest=${bote.zookeeper.digest:}
