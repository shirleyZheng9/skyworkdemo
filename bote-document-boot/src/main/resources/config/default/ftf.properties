# ftf core 框架配置。litchi 支持 ftf 的部分配置
# 默认语言
ftf.i18n.local=zh_CN
# 请求异常时是否返回异常堆栈
ftf.exception.stack.enabled=${exception.stack:true}
# 限制结果集最大数量
ftf.sql.limit-result-set=100000
# 禁用不需要的功能
ftf.cache.enabled=false
ftf.datasource.enabled=false
ftf.jdbc.monitor.enabled=false
# com.ztesoft.zsmart.core.boot.autoconfigure.jdbc.DruidWebAutoConfiguration
ftf.druid.web.filter.enabled=false
# com.ztesoft.zsmart.core.boot.autoconfigure.jdbc.DruidWebManagementConfiguration
ftf.druid.web.servlet.enabled=false
# com.ztesoft.zsmart.core.boot.autoconfigure.web.NbrTraceAutoConfiguration
ftf.nbrtrace.enabled=false
# com.ztesoft.zsmart.core.log.utils.ZCMEnvUtil
ftf.zcm.zmq-enabled=false
# com.ztesoft.zsmart.core.security.data.LogMaskCtrl#LOG_MASK_FLAG
ftf.log.mask.enabled=false
ftf.log.mask.third-party-pkg=org.apache.ibatis.logging.jdbc.BaseJdbcLogger
