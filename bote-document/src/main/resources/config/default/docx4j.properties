# docx4j 解压/反序列化大小限制（用于 Word 转在线文档）
# 优先级：1) Spring Environment 同名配置 2) 配置文件（bote.dc.docx4j.config.file > ZSMART_HOME/etc/docx4j.properties > ZSMART_HOME/etc/coreConfig.properties 直接含 docx4j.* 键 > 本 classpath 文件）
# 默认约 50MB，含大体积嵌入对象（如 OLE/oleObject1.bin）的 docx 会触发 PartTooLargeException 或 FileTooLargeException。
# 提高限制以支持较大手册类文档（如 128MB 嵌入）；单位：字节。-1 表示不限制（慎用）。
docx4j.openpackaging.parts.MAX_BYTES.unzip.error=268435456
docx4j.openpackaging.parts.MAX_BYTES.unmarshal.error=268435456
# 整个 docx 解压后总大小上限（Zip bomb 检测），须大于单 part 限制，否则会报「Total uncompressed size exceeds limit」
docx4j.openpackaging.package.MAX_UNCOMPRESSED_SIZE.unzip.error=268435456
