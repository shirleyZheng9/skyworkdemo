# =====================================
# WebSocket服务配置
# =====================================
# 是否启用WebSocket服务
bote.dc.websocket.enable=true
# =====================================
# 核心配置项（必须配置）
# =====================================
# WebSocket服务端口
bote.dc.websocket.port=9888
# WebSocket基础路径
bote.dc.websocket.path=/bote/ds/ws
# 通用socket地址
bote.dc.websocket.generic-socket-path=/bote/ds/ws/generic
# univer服务socket地址
bote.dc.websocket.univer-socket-path=/bote/ds/ws/univer
# 内部socket连接的认证token
bote.dc.websocket.internal-auth-key=${bote.dc.nodejs.apiKey}
# =====================================
# 可选配置项
# =====================================
# 空闲超时时间（秒）
bote.dc.websocket.idle-timeout=60
# 是否启用WebSocket压缩
bote.dc.websocket.enable-compression=true
# 是否启用详细日志
bote.dc.websocket.enable-logging=false
