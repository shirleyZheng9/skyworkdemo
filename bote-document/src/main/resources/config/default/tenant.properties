# 是否开启租户拦截
bote.dc.tenant.enable=true
# 启用多租户的包路径
bote.dc.tenant.enable-packages=com.iwhalecloud.bote.doc
# 忽略租户的表
bote.dc.tenant.ignore-tables[0]=bt_file
bote.dc.tenant.ignore-tables[1]=bt_docchain_extra_cfg
bote.dc.tenant.ignore-tables[2]=bt_knowledge_query_record
bote.dc.tenant.ignore-tables[3]=bt_space_docchain_rel
bote.dc.tenant.ignore-tables[4]=bt_dc_library_permission
bote.dc.tenant.ignore-tables[5]=bt_dc_document_permission
bote.dc.tenant.ignore-tables[6]=bt_dc_kb_permission
